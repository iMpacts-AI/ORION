name: Keyboard + mouse end-to-end

# Proves ORION's keyboard and mouse control by checking what a real window
# receives (tests/input). Runs on a real Windows desktop and, as a fast logic
# cross-check, on Linux with the Windows helper under Wine.

on:
  push:
    branches: [main]
    paths: ['native/**', 'tests/input/**', 'tools/hotfix/**', '.github/workflows/input-e2e.yml']
  pull_request:
    paths: ['native/**', 'tests/input/**', 'tools/hotfix/**', '.github/workflows/input-e2e.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (real desktop)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build helper + probe
        run: |
          dotnet build native/win32-native-input -c Release -o build/helper
          dotnet build native/input-probe -c Release -o build/probe
      - name: Helper end-to-end
        env:
          ORION_E2E_REPORT: ${{ runner.temp }}/helper-e2e.json
        run: node tests/input/helper-e2e.mjs --helper build/helper/win32-native-input.exe --probe build/probe/input-probe.exe --log ${{ runner.temp }}\probe.log
      - name: Install ORION v1.2.0 (for its JS input layer)
        if: ${{ !cancelled() }}
        shell: powershell
        env:
          ORION_VERSION: v1.2.0
          ORION_NO_PATH: '1'
        run: '& .\install.ps1'
      - name: JS layer end-to-end (patched v1.2.0)
        if: ${{ !cancelled() }}
        env:
          ORION_E2E_REPORT: ${{ runner.temp }}/js-e2e.json
        shell: bash
        run: |
          node tools/hotfix/patch-input-v1.2.0.mjs "$LOCALAPPDATA/orion-cli/app/orion.mjs" build/orion.patched.mjs
          node tests/input/js-driver-e2e.mjs --orion build/orion.patched.mjs --helper build/helper/win32-native-input.exe --probe build/probe/input-probe.exe --log "${{ runner.temp }}\\probe.log"
      - name: Screenshot on failure
        if: failure()
        run: build/helper/win32-native-input.exe screenshot ${{ runner.temp }}\screen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: input-e2e-windows
          path: |
            ${{ runner.temp }}/*.json
            ${{ runner.temp }}/probe.log
            ${{ runner.temp }}/screen.png
          if-no-files-found: ignore

  wine:
    name: Linux + Wine (logic cross-check)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Xvfb + Wine
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb x11-utils wine64 wine
      - name: Install ORION v1.2.0 (for its JS input layer)
        env:
          ORION_VERSION: v1.2.0
          ORION_INSTALL_DIR: ${{ runner.temp }}/orion/app
          ORION_BIN_DIR: ${{ runner.temp }}/orion/bin
        run: bash ./install.sh
      - name: Keyboard + mouse end-to-end under Wine
        env:
          ORION_WINE_WORK: ${{ runner.temp }}/wine
        run: tests/input/run-under-wine.sh "${{ runner.temp }}/orion/app/orion.mjs"
